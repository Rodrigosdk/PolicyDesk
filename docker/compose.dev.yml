services:
  api:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://dashboard:18889
    depends_on:
      dashboard:
        condition: service_started

  # Aspire Dashboard: logs, traces e métricas da API via OpenTelemetry (OTLP).
  # Interface em http://localhost:18888. Para a API rodando fora do Docker (dotnet run),
  # o OTLP gRPC fica exposto em localhost:4317.
  # Uso local apenas: o acesso anônimo deixa a interface e o OTLP sem autenticação.
  dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"
      - "4317:18889"

  pgadmin:
    image: dpage/pgadmin4:9
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@policydesk.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-policy-desk-local}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgadmin-data:
