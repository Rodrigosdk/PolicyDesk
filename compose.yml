services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: PolicyDesk
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-policy-desk-local}
    ports:
      - "5432:5432"
    volumes:
      - policy-desk-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DbConnection: Host=db;Port=5432;Database=PolicyDesk;Username=admin;Password=${POSTGRES_PASSWORD:-policy-desk-local}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  policy-desk-data:
