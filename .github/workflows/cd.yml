name: CD

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  migrations:
    name: Bundle de migrations
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar o .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache de pacotes NuGet
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restaurar ferramentas locais
        run: dotnet tool restore

      - name: Restaurar a infraestrutura para linux-x64
        run: dotnet restore src/Backend/PolicyDesk.Infrastructure/PolicyDesk.Infrastructure.csproj --runtime linux-x64

      - name: Gerar o bundle de migrations
        run: >
          dotnet ef migrations bundle
          --project src/Backend/PolicyDesk.Infrastructure
          --startup-project src/Backend/PolicyDesk.Infrastructure
          --configuration Release
          --self-contained
          --runtime linux-x64
          --output artifacts/migrations/efbundle

      - name: Anexar as migrations
        uses: actions/upload-artifact@v7
        with:
          name: migrations
          path: artifacts/migrations
          retention-days: 7

  image:
    name: Imagem Docker
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Definir o nome da imagem
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-api" >> "$GITHUB_OUTPUT"

      - name: Preparar o Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar e publicar a imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy em produção
    needs: [migrations, image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Baixar as migrations
        uses: actions/download-artifact@v8
        with:
          name: migrations
          path: migrations

      - name: Login na Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Aplicar as migrations
        env:
          DB_CONNECTION: ${{ secrets.DATABASE_CONNECTION_STRING }}
        run: |
          chmod +x migrations/efbundle
          migrations/efbundle --connection "$DB_CONNECTION"

      - name: Deploy da imagem no Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          images: ${{ needs.image.outputs.image }}:${{ github.sha }}

      - name: Smoke test (/health)
        run: >
          curl --fail --silent --show-error
          --retry 18 --retry-delay 10 --retry-all-errors
          --max-time 30
          "https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/health"

      - name: Logout da Azure
        if: always()
        run: az logout || true
