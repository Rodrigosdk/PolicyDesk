version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    target-branch: developer
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      microsoft:
        patterns: ['Microsoft.*', 'System.*', 'Npgsql*']
      opentelemetry:
        patterns: ['OpenTelemetry*']
      testes:
        patterns: ['xunit*', 'Moq', 'Shouldly', 'Bogus', 'coverlet*', 'Testcontainers*']
    ignore:
      - dependency-name: 'Microsoft.*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'System.*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'Npgsql*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'Swashbuckle.*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'dotnet-ef'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    target-branch: developer
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /docker
    target-branch: developer
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: 'dotnet/*'
        update-types: ['version-update:semver-major']
