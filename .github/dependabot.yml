version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    target-branch: developer
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      microsoft:
        patterns: ['Microsoft.*', 'System.*', 'Npgsql*']
      opentelemetry:
        patterns: ['OpenTelemetry*']
      testes:
        patterns: ['xunit*', 'Moq', 'Shouldly', 'Bogus', 'coverlet*', 'Testcontainers*']

  - package-ecosystem: github-actions
    directory: /
    target-branch: developer
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /docker
    target-branch: developer
    schedule:
      interval: weekly
      day: monday
